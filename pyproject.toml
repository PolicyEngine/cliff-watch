[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliff-watch"
version = "0.2.0"
description = "Dynamic benefit cliff calculator built on PolicyEngine-US."
requires-python = ">=3.11"
# Vercel installs from this file (through uv.lock) on every deploy. policyengine's
# `us` extra pins policyengine-us, policyengine-core and spm-calculator exactly,
# so this one pin sets the engine. The commit is the head of
# PolicyEngine/policyengine.py#739, which lets calculate_household take several
# marital units; move to the PyPI release that carries it before merging.
dependencies = [
    "policyengine[us] @ git+https://github.com/PolicyEngine/policyengine.py@393a569cfea034891a124a7de7e74165a066dc18",
    # policyengine's `us` extra pins this version too, so `uv lock` fails if the
    # two ever disagree. A URL source keeps the package in the function's zip and
    # out of the cold-start install: see "Cold-start install" in the README.
    "policyengine-us @ https://files.pythonhosted.org/packages/5e/09/86ac3968d2a18e28fce3ba1186fc21728e9f299b96a806d6f204f1e0aaed/policyengine_us-2.2.1-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
cliff-watch-dev-server = "cliff_watch.dev_server:main"

[tool.hatch.build.targets.wheel]
packages = ["cliff_watch"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# A household calculation never imports these, and leaving them out keeps the
# cold-start install small enough to survive a stopped attempt: see "Cold-start
# install" in the README. Each one comes in through a dependency's own
# requirements: plotly through policyengine-core, tables (with blosc2, msgpack and
# ndindex) through policyengine-us, hf-xet through huggingface-hub, and jedi (with
# parso) through IPython, which runs without it.
override-dependencies = [
    "hf-xet; sys_platform == 'never'",
    "jedi; sys_platform == 'never'",
    "plotly; sys_platform == 'never'",
    "tables; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
