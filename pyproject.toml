[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliff-watch"
version = "0.2.0"
description = "Dynamic benefit cliff calculator built on PolicyEngine-US."
requires-python = ">=3.11"
# Vercel installs from this file (through uv.lock) on every deploy, so the
# engine is pinned exactly.
#
# - policyengine-us 1.755.5 is the engine production has served since
#   2026-07-03. PyPI no longer hosts it, so it is built from its release
#   commit, whose wheel matches PyPI's 1.755.5 file for file. The nearest
#   releases PyPI still hosts change displayed numbers (1.755.0, 1.768.1), and
#   1.824.6 no longer has ccdf_age_group, which this app sets.
# - policyengine-core 3.27.0 through 3.29.2 forbade randomness with a runtime
#   guard that patched numpy.random process-wide while any formula ran, so
#   concurrent requests on one instance failed with "rules-engine formulas
#   must be deterministic" (#38). 3.30.0 replaced it with a static check
#   (policyengine-core#519). This app is verified on 3.32.1; 3.32.2 and later
#   reject 1.755.5's parameter files (uprating rounding validation).
dependencies = [
    "policyengine-us @ https://github.com/PolicyEngine/policyengine-us/archive/fc64cef64ab55c3c48309c7fb304c35e5f3c9184.tar.gz",
    "policyengine-core>=3.32.0,<3.32.2",
    "spm-calculator==0.3.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
cliff-watch-dev-server = "cliff_watch.dev_server:main"

[tool.hatch.build.targets.wheel]
packages = ["cliff_watch"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# A household calculation never imports these, and leaving them out brings the
# function inside Vercel's bundle, so no install runs at cold start: see "Cold-start
# install" in the README. Each one comes in through a dependency's own
# requirements: plotly through policyengine-core, tables through policyengine-us,
# hf-xet through huggingface-hub, and jedi through IPython, which runs without it.
# Packages that only these require leave with them, including blosc2 and everything
# it brings (httpx, pydantic and rich among them) with tables.
override-dependencies = [
    "hf-xet; sys_platform == 'never'",
    "jedi; sys_platform == 'never'",
    "plotly; sys_platform == 'never'",
    "tables; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
