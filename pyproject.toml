[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliff-watch"
version = "0.2.0"
description = "Dynamic benefit cliff calculator built on PolicyEngine-US."
requires-python = ">=3.11"
# Vercel installs from this file (through uv.lock) on every deploy. policyengine's
# `us` extra pins policyengine-us, policyengine-core and spm-calculator exactly,
# so this one pin sets the engine. The commit is the head of
# PolicyEngine/policyengine.py#739, which lets calculate_household take several
# marital units; move to the PyPI release that carries it before merging.
dependencies = [
    "policyengine[us] @ git+https://github.com/PolicyEngine/policyengine.py@393a569cfea034891a124a7de7e74165a066dc18",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
cliff-watch-dev-server = "cliff_watch.dev_server:main"

[tool.hatch.build.targets.wheel]
packages = ["cliff_watch"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
