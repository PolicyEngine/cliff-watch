name: Build Frontend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUN_VERSION: 1.3.10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        run: |
          npm install --prefix "$RUNNER_TEMP/bun" --fetch-retries=5 "bun@$BUN_VERSION"
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bun/node_modules/.bin/bun" --version

      - name: Install dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build
